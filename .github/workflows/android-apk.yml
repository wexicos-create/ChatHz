name: Build ChatHz Android APK (Gradle)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Instal/ChatHz.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies and validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Android platform (preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Android Gradle project
        run: bash scripts/android-prepare.sh
      - name: Compile installable debug APK with Gradle
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify generated binary
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHz-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish binary in repository
        run: |
          mkdir -p Instal
          cp android/app/build/outputs/apk/debug/app-debug.apk Instal/ChatHz.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Instal/ChatHz.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: publish compiled ChatHz debug APK [skip ci]"
            git push
          fi
